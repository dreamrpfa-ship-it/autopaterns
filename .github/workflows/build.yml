name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilation
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autopaterns-jar
          path: build/libs/*.jar
